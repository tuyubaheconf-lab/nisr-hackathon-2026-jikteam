[build]
  base = "web"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Static security headers (CSP, HSTS, framing, ...) live in web/public/_headers
# so they ship inside web/dist and survive a drag-and-drop deploy too.

# GET /api/prices -> the Turso read path (web/netlify/functions/prices.mjs).
# Relative to [build] base, which is web/.
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/prices"
  to = "/.netlify/functions/prices"
  status = 200
